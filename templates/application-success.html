<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Application Submitted | MatchIQ</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="jobs-page">


<div style="
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
">

    <div style="
        max-width: 600px;
        width: 100%;
        background: white;
        padding: 50px;
        border-radius: 24px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(30, 50, 100, 0.12);
    ">

        <div style="
            width: 75px;
            height: 75px;
            margin: 0 auto 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e9f8ef;
            color: #22a05a;
            font-size: 35px;
        ">
            ✓
        </div>


        <h1>
            Application Submitted!
        </h1>


        <p style="
            margin-top: 15px;
            color: #71809b;
        ">
            Your application for
            <strong>
                {{ application.job_title }}
            </strong>
            at
            <strong>
                {{ application.company }}
            </strong>
            has been submitted successfully.
        </p>


        <p style="
            margin-top: 12px;
            color: #71809b;
        ">
            Application ID:
            <strong>
                {{ application.application_id }}
            </strong>
        </p>


        <a
            href="{{ url_for('jobs') }}"
            style="
                display: inline-block;
                margin-top: 30px;
                padding: 15px 30px;
                border-radius: 10px;
                background: linear-gradient(135deg, #536bd8, #7650d5);
                color: white;
                text-decoration: none;
                font-weight: 700;
            "
        >
            Back to Job Matches
        </a>

    </div>

</div>


</body>

</html>
